name: Release

# Tag-driven: `git tag v1.0.0 && git push origin v1.0.0` builds and signs both
# artifacts. The GitHub release is created as a DRAFT so nothing goes public
# until you review it and press publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore never lives in the repo. Store it as a base64 blob in
      # Actions secrets:  base64 -w0 rapidreader-upload.jks
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > rapidreader-upload.jks

      - name: Build signed APK and AAB
        env:
          RELEASE_STORE_FILE: rapidreader-upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Name artifacts after the tag
        run: |
          mkdir -p dist
          NAME="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "dist/LeerRapidon-${NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/LeerRapidon-${NAME}.aab"

      # The .aab is deliberately NOT attached to the public release — it is
      # only useful to Play, and uploading it is a manual Console step. Kept
      # as a workflow artifact so you can download the exact bundle CI signed.
      - name: Upload AAB for the Play Console
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: dist/*.aab
          retention-days: 90

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: true

      - name: Remove keystore from the runner
        if: always()
        run: rm -f rapidreader-upload.jks
